<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Face Attendance</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #6b7280; --line: #e5e7eb; --no: #b91c1c; --accent: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button { width: 100%; margin-top: 20px; font: inherit; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #error { color: var(--no); font-size: 14px; margin-top: 12px; min-height: 20px; }
  a { display: block; text-align: center; margin-top: 16px; color: var(--accent); text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<form class="card" id="form">
  <h1>Admin login</h1>
  <div class="sub">Face Attendance dashboard</div>
  <label for="username">Login</label>
  <input id="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button id="submit">Log in</button>
  <div id="error"></div>
  <a href="/">← Back to live demo</a>
</form>

<script>
  const form = document.getElementById('form');
  const errorEl = document.getElementById('error');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorEl.textContent = '';
    submit.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) { location.href = '/dashboard'; return; }
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.detail || 'Login failed';
    } catch {
      errorEl.textContent = 'Connection problem, try again.';
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
