# /etc/nginx/sites-available/face-attendance
# face.example.com ni o'zingizning domeningiz (yoki subdomeningiz) bilan almashtiring.
server {
    listen 80;
    server_name face.example.com;

    client_max_body_size 3m;   # kadrlar 2 MB gacha

    location / {
        proxy_pass http://127.0.0.1:3250;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
